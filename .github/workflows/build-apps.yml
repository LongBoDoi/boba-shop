name: Build apps

# The phone apps: the web build in a Capacitor shell, one `.apk` and one unsigned `.ipa`, published
# as a GitHub release. Run it by hand, when a new file is actually wanted.
#
# The *page* keeps itself current — installed to a home screen it fetches the newest build on every
# launch (public/sw.js) — but an app built here carries the game inside it, so a change only
# reaches an installed app through a new file from this workflow.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the .apk and .ipa'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.read.outputs.native }}
      name: ${{ steps.read.outputs.name }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read the native shell version
        id: read
        run: |
          # `v<native shell>.<run>` is the whole of how an installed app tells whether this file is
          # worth installing — see src/updates/release.ts. tools/check-updates.cjs holds this read.
          native="$(node -p "/NATIVE_VERSION = (\\d+)/.exec(require('fs').readFileSync('src/updates/native.ts','utf8'))[1]")"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "name=$native.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v$native.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression checks
        run: npm test

      - name: Build the game
        # The same build id the deploy gives this commit, so an app built from it does not open
        # offering itself an update.
        env:
          BUILD_ID: ${{ github.sha }}
        run: npx vite build

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist
          if-no-files-found: error

  android:
    needs: [version, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Stamped in as versionCode/versionName, so a newer .apk installs over an older one.
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm ci --ignore-scripts

      - name: Fetch the web build
        uses: actions/download-artifact@v8
        with:
          name: web
          path: dist

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/tiem-tra-sua-${VERSION_NAME}.apk"
          ls -lh "$GITHUB_WORKSPACE"/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ./*.apk
          if-no-files-found: error

  ios:
    needs: [version, web]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor
        run: npm ci --ignore-scripts

      - name: Fetch the web build
        uses: actions/download-artifact@v8
        with:
          name: web
          path: dist

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Copy the game into the iOS project
        run: npx cap sync ios

      - name: Archive without signing
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tiem-tra-sua.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${{ needs.version.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | { xcbeautify --quieter || cat; }

      - name: Show what failed
        if: failure()
        run: |
          echo '::group::Lines reporting an error'
          grep -nE '(^|[[:space:]])error:|\*\* ARCHIVE FAILED|The following build commands failed' \
            "$RUNNER_TEMP/xcodebuild.log" | head -60 || echo '(no error: lines found)'
          echo '::endgroup::'
          echo '::group::Last 100 lines'
          tail -100 "$RUNNER_TEMP/xcodebuild.log"
          echo '::endgroup::'
          echo '::error::xcodebuild archive failed. The full log is in the xcodebuild-log artifact.'

      - name: Upload the Xcode log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/tiem-tra-sua.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "tiem-tra-sua-${{ needs.version.outputs.name }}-unsigned.ipa" Payload)
          mv "$RUNNER_TEMP/tiem-tra-sua-${{ needs.version.outputs.name }}-unsigned.ipa" .
          ls -lh ./*.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: ./*.ipa
          if-no-files-found: error

  release:
    needs: [version, android, ios]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the built apps
        uses: actions/download-artifact@v8
        with:
          pattern: '{apk,ipa}'
          path: out
          merge-multiple: true

      - name: List what will be published
        run: ls -lhR out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          Tiệm Trà Sữa, built from this commit.

          | File | Platform | Notes |
          | --- | --- | --- |
          | `.apk` | Android | Copy it to the phone and open it; allow installs from that source. A later build installs over this one and keeps the shop. |
          | `.ipa` | iOS | **Unsigned.** iOS will not install it as-is. Re-sign it with Sideloadly or AltStore using a free Apple ID (it then runs for 7 days per install), or with a paid developer certificate. |

          **The app keeps itself up to date from here.** It asks on launch whenever the site is
          serving a newer build, downloads it into place and restarts — no reinstall, and the shop
          is untouched. A file like this one is only needed when the app's *native* side changes,
          which is what the first number of the tag counts: an app on shell
          ${{ needs.version.outputs.native }} is current.

          **You do not need either of these to play.** The game is a web game: open
          https://boba-shop.expo.app and add it to the home screen, and it runs with no browser
          chrome, keeps its own shop and plays with no signal.

          Moving a shop between the page and the app, or from the old app: ⚙️ Cài đặt → Sao lưu
          tiệm, copy the code, and paste it into the same card on the other one.
          NOTES
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tiệm Trà Sữa ${{ needs.version.outputs.name }}" \
            --notes-file notes.md \
            out/*.apk out/*.ipa
          echo "Released [$TAG]($(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
