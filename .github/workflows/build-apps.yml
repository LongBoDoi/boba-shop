name: Build apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the .apk and .ipa'
        type: boolean
        default: true
      android_build_id:
        description: 'Reuse this finished EAS build instead of starting a new one (optional)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read the app version
        id: read
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          REUSE: ${{ inputs.android_build_id }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository Actions secret. See docs/deployment.md."
            exit 1
          fi
          if [ -n "$REUSE" ]; then
            echo "Reusing EAS build $REUSE instead of starting a new one"
            npx --yes eas-cli@latest build:view "$REUSE" --json > eas-build.json
          else
            npx --yes eas-cli@latest build \
              --platform android \
              --profile apk \
              --non-interactive \
              --wait \
              --json > eas-build.json
          fi

      - name: Download the APK
        run: |
          url="$(node -e '
            const builds = require("./eas-build.json");
            const build = Array.isArray(builds) ? builds[0] : builds;
            const url = build?.artifacts?.applicationArchiveUrl;
            if (!url) {
              console.error("No applicationArchiveUrl in the EAS build result; status is " + build?.status);
              process.exit(1);
            }
            console.log(url);
          ')"
          curl -fsSL -o "boba-shop-${{ needs.version.outputs.version }}.apk" "$url"
          ls -lh ./*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ./*.apk
          if-no-files-found: error

  ios:
    needs: version
    # macos-15 defaults to Xcode 16.4 (Swift 6.1). Expo SDK 57's precompiled
    # ExpoModulesJSI xcframework resolves a SwiftPM package that requires Swift
    # tools 6.2, so the archive needs an Xcode 26 image.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Find the Xcode scheme
        id: scheme
        run: |
          workspace="$(ls -d ios/*.xcworkspace | head -1)"
          # The app scheme is named after the generated .xcodeproj. Listing the
          # workspace instead also returns every CocoaPods scheme, and picking one
          # of those archives a pod library rather than the app.
          scheme="$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)"
          if ! xcodebuild -workspace "$workspace" -list -json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).workspace.schemes;if(!n.includes(process.argv[1])){console.error("Schemes found: "+n.join(", "));process.exit(1)}})' "$scheme"; then
            echo "::error::Scheme '$scheme' is not in $workspace"
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Building scheme '$scheme' from $workspace"

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace '${{ steps.scheme.outputs.workspace }}' \
            -scheme '${{ steps.scheme.outputs.scheme }}' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/boba-shop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | { xcbeautify --quieter || cat; }

      - name: Show what failed
        if: failure()
        run: |
          echo '::group::Lines reporting an error'
          grep -nE '(^|[[:space:]])error:|\*\* ARCHIVE FAILED|The following build commands failed' \
            "$RUNNER_TEMP/xcodebuild.log" | head -60 || echo '(no error: lines found)'
          echo '::endgroup::'
          echo '::group::Last 100 lines'
          tail -100 "$RUNNER_TEMP/xcodebuild.log"
          echo '::endgroup::'
          echo '::error::xcodebuild archive failed. The full log is in the xcodebuild-log artifact.'

      - name: Upload the Xcode log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/boba-shop.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "boba-shop-${{ needs.version.outputs.version }}-unsigned.ipa" Payload)
          mv "$RUNNER_TEMP/boba-shop-${{ needs.version.outputs.version }}-unsigned.ipa" .
          ls -lh ./*.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: ./*.ipa
          if-no-files-found: error

  release:
    needs: [version, android, ios]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the built apps
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lhR dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Tiệm Trà Sữa, built from this commit.

          | File | Platform | Notes |
          | --- | --- | --- |
          | `.apk` | Android | Signed with the project's EAS keystore. Copy it to the phone and open it; allow installs from that source. |
          | `.ipa` | iOS | **Unsigned.** iOS will not install it as-is. Re-sign it with Sideloadly or AltStore using a free Apple ID (the app then runs for 7 days per install), or with a paid Apple Developer certificate. |

          You can also just play the game in a browser: https://boba-shop.expo.app
          NOTES
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tiệm Trà Sữa $VERSION (build ${{ github.run_number }})" \
            --notes-file notes.md \
            dist/*.apk dist/*.ipa
          echo "Released [$TAG]($(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
