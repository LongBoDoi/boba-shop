name: Deploy web

# The game is a web game, so this is the one that ships it: every push to `main` builds the page
# and publishes it to the production link, https://boba-shop.expo.app.
#
# **It publishes to that one URL and nothing else.** A deploy without `--prod` would put the build
# on a URL of its own, and `--alias <name>` would add a named one; the shop has one address, and
# an installed page is pinned to it (see "The page as the app" in CLAUDE.md), so a second link is
# a second game to keep in step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression checks
        run: npm test

      - name: Build the game
        run: npx vite build

      - name: Deploy to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository Actions secret. See docs/deployment.md."
            exit 1
          fi
          # `app.json` is not an app config any more — it is only the hosting project this is
          # published to. See docs/deployment.md.
          npx --yes eas-cli@latest deploy --prod --non-interactive

      - name: Show production URL
        run: echo '[Open the game](https://boba-shop.expo.app)' >> "$GITHUB_STEP_SUMMARY"
