<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- This page is also the phone app: added to the home screen it opens without browser chrome,
         keeps its own storage, and (see sw.js) opens with no signal. The native builds draw the
         same game through react-native-svg, where every shape is an Android View and a loaded cup
         is six hundred of them; here it is a browser's own compositor. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFE3EC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads none of the manifest: standalone mode, the title under the icon and the icon
         itself are all taken from these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiệm Trà Sữa" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="game-surface">
      /* The page is a game surface, not a document. A hold is "pour" or "carry" — never
         "select this text", "save this image" or "zoom". RNW styles its own elements with
         single-class rules, so the selection properties have to out-rank them. */
      * {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-user-drag: none !important;
        touch-action: manipulation;
      }
      /* The one exception, and it has to carry `!important` to get back past the rule above:
         the backup code in the settings card is text whose entire purpose is to be selected and
         copied. The blanket rule made it uncopyable on the web — the only platform where the
         player has no long-press "select all" to fall back on. Inputs are not a game surface. */
      input,
      textarea {
        -webkit-touch-callout: default !important;
        -webkit-user-select: text !important;
        user-select: text !important;
      }
      /* Long-pressing an image is what opens the iOS share sheet; let the taps fall through
         to the View that owns the gesture instead. */
      img {
        pointer-events: none;
      }
      html,
      body {
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Pins the page so Safari cannot rubber-band or pull-to-refresh the game away. */
      body {
        position: fixed;
        width: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Bạn cần bật JavaScript để chơi trò chơi này.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // The browser gestures that survive CSS have to be refused by hand: the context menu an
      // Android long-press raises, a drag started on artwork, a selection dragged across labels,
      // and the iOS pinch-zoom gestures.
      (function () {
        var refuse = function (event) {
          event.preventDefault();
        };
        ["contextmenu", "dragstart", "selectstart"].forEach(function (name) {
          document.addEventListener(name, refuse);
        });
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
          document.addEventListener(name, refuse, { passive: false });
        });
      })();
    </script>
    <script>
      // The shop is kept on the phone: see public/sw.js. Registered after load so that fetching
      // and starting the worker never competes with the artwork the loading screen is waiting on,
      // and wrapped because a browser with service workers switched off must still play the game.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (error) {
            console.warn("Không đăng ký được service worker:", error);
          });
        });
      })();
      // Ask for the save to be kept rather than evicted. A browser may clear "temporary" storage
      // when the device is short of room, and the shop — days, takings, the cup on the coaster —
      // lives in localStorage. Granted without a prompt for an installed app; refused silently
      // elsewhere, which costs nothing. See "Saving the shop" in CLAUDE.md.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(function (already) {
          if (!already) navigator.storage.persist();
        });
      }
    </script>
  </body>
</html>
